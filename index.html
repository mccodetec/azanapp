<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerala Prayer & Azan Times</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        h2 { margin-bottom: 12px; font-weight: 600; font-size: 20px; }
        label { font-size: 12px; font-weight: 300; display: block; text-align: left; margin-top: 8px; }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .time-box {
            font-size: 15px;
            font-weight: 400;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 8px;
            margin: 12px 0;
        }
        .timings-list {
            text-align: left;
            background: rgba(0, 0, 0, 0.15);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
        }
        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .prayer-row input {
            width: 45px;
            padding: 3px;
            text-align: center;
            border-radius: 5px;
            border: none;
            font-size: 12px;
            background: rgba(255,255,255,0.9);
        }
        .controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .btn.secondary { background: #2ed573; }
    </style>
</head>
<body>

<div class="card">
    <h2>Kerala Prayer Times</h2>
    
    <label for="district">Select District:</label>
    <select id="district" onchange="getTimings()">
        <option value="Kozhikode">Kozhikode</option>
        <option value="Malappuram">Malappuram</option>
        <option value="Thiruvananthapuram">Thiruvananthapuram</option>
        <option value="Ernakulam">Ernakulam</option>
        <option value="Kannur">Kannur</option>
        <option value="Palakkad">Palakkad</option>
        <option value="Thrissur">Thrissur</option>
    </select>

    <div class="time-box" id="currentTime">Current Time: --:--:--</div>
    
    <div class="timings-list">
        <div class="prayer-row"><span>Fajr:</span> <span id="fajr">--:--</span> <label style="margin:0">Offset(+/-): <input type="number" id="off_Fajr" value="0" onchange="getTimings()"></label></div>
        <div class="prayer-row"><span>Dhuhr:</span> <span id="dhuhr">--:--</span> <label style="margin:0">Offset(+/-): <input type="number" id="off_Dhuhr" value="0" onchange="getTimings()"></label></div>
        <div class="prayer-row"><span>Asr:</span> <span id="asr">--:--</span> <label style="margin:0">Offset(+/-): <input type="number" id="off_Asr" value="0" onchange="getTimings()"></label></div>
        <div class="prayer-row"><span>Maghrib:</span> <span id="maghrib">--:--</span> <label style="margin:0">Offset(+/-): <input type="number" id="off_Maghrib" value="0" onchange="getTimings()"></label></div>
        <div class="prayer-row"><span>Isha:</span> <span id="isha">--:--</span> <label style="margin:0">Offset(+/-): <input type="number" id="off_Isha" value="0" onchange="getTimings()"></label></div>
    </div>

    <div class="controls">
        <button class="btn" id="enableAudio" onclick="initAudio()">1. Enable Azan Sound</button>
        <button class="btn secondary" id="toggleAlarm" onclick="toggleAlarmStatus()">Alarm: ON</button>
    </div>
</div>

<audio id="normalAzan" src="https://islamicfinder.org/audio/azan.mp3" preload="auto"></audio>
<audio id="fajrAzan" src="https://www.islamcan.com/audio/adhan/azan2.mp3" preload="auto"></audio>

<script>
    let azanPlayedToday = {};
    let alarmActive = true;
    let rawTimingsData = {};

    function initAudio() {
        const audio1 = document.getElementById('normalAzan');
        const audio2 = document.getElementById('fajrAzan');
        audio1.play().then(() => {
            audio1.pause();
            audio1.currentTime = 0;
            audio2.play().then(() => {
                audio2.pause();
                audio2.currentTime = 0;
                document.getElementById('enableAudio').style.display = 'none';
                alert("Azan Sound Enabled Successfully!");
            });
        }).catch(e => console.log("Audio Init Error:", e));
    }

    function toggleAlarmStatus() {
        alarmActive = !alarmActive;
        const btn = document.getElementById('toggleAlarm');
        btn.innerText = alarmActive ? "Alarm: ON" : "Alarm: OFF";
        btn.style.background = alarmActive ? "#2ed573" : "#ffa502";
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('currentTime').innerText = "Current Time: " + now.toLocaleTimeString('en-US', {hour12: true});
        if (alarmActive) {
            checkAzanTime(now);
        }
    }, 1000);

    function getTimings() {
        const district = document.getElementById('district').value;

        fetch(`https://api.aladhan.com/v1/timingsByCity?city=${district}&country=India&method=2`)
            .then(response => response.json())
            .then(data => {
                if (data && data.data && data.data.timings) {
                    rawTimingsData = data.data.timings;
                    updateDisplayedTimings();
                }
            })
            .catch(err => console.error(err));
    }

    function updateDisplayedTimings() {
        if (!rawTimingsData.Fajr) return;

        ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(prayer => {
            let offset = parseInt(document.getElementById(`off_${prayer}`).value) || 0;
            let adjustedTime = adjustMinutes(rawTimingsData[prayer], offset);
            
            // Save final adjusted time globally for alarm checking
            if(!window.currentTimings) window.currentTimings = {};
            window.currentTimings[prayer] = adjustedTime;

            document.getElementById(prayer.toLowerCase()).innerText = format12Hour(adjustedTime);
        });
    }

    function adjustMinutes(timeStr, mins) {
        let [h, m] = timeStr.split(':').map(Number);
        let date = new Date();
        date.setHours(h, m + mins, 0);
        return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function format12Hour(time24) {
        let [hours, minutes] = time24.split(':');
        let h = parseInt(hours);
        let ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12;
        h = h ? h : 12;
        return `${h}:${minutes} ${ampm}`;
    }

    function checkAzanTime(now) {
        if (!window.currentTimings) return;

        let currentTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        let todayStr = now.toDateString();

        ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(prayer => {
            let prayerTime = window.currentTimings[prayer];
            let key = `${todayStr}-${prayer}`;

            if (prayerTime === currentTimeStr && !azanPlayedToday[key]) {
                let audio = (prayer === 'Fajr') ? document.getElementById('fajrAzan') : document.getElementById('normalAzan');
                audio.play().catch(err => console.log("Auto-play blocked:", err));
                azanPlayedToday[key] = true;
            }
        });
    }

    getTimings();
</script>

</body>
</html>
